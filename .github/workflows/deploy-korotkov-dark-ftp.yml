name: FTP deploy Korotkov Dark theme

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Проверочный запуск без загрузки файлов"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - design/portfolio-refresh
    paths:
      - "wp-content/themes/korotkov-dark/**"

permissions:
  contents: read

concurrency:
  group: ftp-deploy-korotkov-dark
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "::error::Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "::error::Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::Missing FTP_PASSWORD"; exit 1; }

      - name: Deploy theme by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/korotkov-dark/
          server-dir: /www/ipkorotkov.online/wp-content/themes/korotkov-dark/
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          log-level: verbose
