name: Enable Korotkov SEO Factory paid Yandex APIs

on:
  push:
    branches:
      - design/portfolio-refresh
    paths:
      - '.github/workflows/enable-ksef-search-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enable-ksef-search-api
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Check connection secrets
        env:
          KWC_TOKEN: ${{ secrets.KWC_API_TOKEN }}
          WP_USER: ${{ secrets.KWC_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.KWC_WP_APP_PASSWORD }}
        run: |
          test -n "$KWC_TOKEN" || { echo "::error::Missing KWC_API_TOKEN"; exit 1; }
          test -n "$WP_USER" || { echo "::error::Missing KWC_WP_USERNAME"; exit 1; }
          test -n "$WP_APP_PASSWORD" || { echo "::error::Missing KWC_WP_APP_PASSWORD"; exit 1; }

      - name: Enable paid Search API calls in the installed SEO Factory client
        env:
          KWC_TOKEN: ${{ secrets.KWC_API_TOKEN }}
          WP_USER: ${{ secrets.KWC_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.KWC_WP_APP_PASSWORD }}
          KWC_BASE_URL: https://ipkorotkov.online
        shell: bash
        run: |
          set -euo pipefail
          WP_APP_PASSWORD="${WP_APP_PASSWORD// /}"
          READ_JSON="$(mktemp)"
          WRITE_JSON="$(mktemp)"
          CONFIG_FILE="$(mktemp)"
          HTTP_CODE=$(curl --silent --show-error --output "$READ_JSON" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --get --data-urlencode "path=plugins/korotkov-seo-factory/includes/class-search-client.php" \
            "$KWC_BASE_URL/wp-json/kwc/v1/read")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::WP Control cannot read the SEO Factory Search client (HTTP $HTTP_CODE). No change was made."
            jq '{code,message}' "$READ_JSON" 2>/dev/null || true
            exit 1
          fi
          jq -er '.content' "$READ_JSON" > "$CONFIG_FILE"
          EXPECTED_SHA=$(jq -er '.sha256' "$READ_JSON")
          python3 - "$CONFIG_FILE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          rules = [
            ("automation toggle", r"        // Кэш доступен и при выключенной автоматизации; новые внешние запросы — нет\.\n        if \(empty\(\$settings\['automation_enabled'\]\)\) \{\n            return new WP_Error\('ksef_automation_disabled'.*?\n        \}\n"),
            ("billing approval", r"        if \(!defined\('KSEF_BILLING_VERIFIED'\) \|\| KSEF_BILLING_VERIFIED !== true\) \{\n            return new WP_Error\('ksef_billing_not_verified'.*?\n        \}\n"),
            ("project budget gate", r"        \$budget = KSEF_Util::check_budget\(\);\n        if \(is_wp_error\(\$budget\)\) \{\n            KSEF_Lock::release\(\$lock\);\n            return \$budget;\n        \}\n"),
            ("daily request cap", r"        if \(\$used >= self::DAILY_LIMIT\) \{\n            KSEF_Lock::release\(\$lock\);\n            return new WP_Error\('ksef_search_daily_limit'.*?\n        \}\n"),
            ("minimum request interval", r"        if \(time\(\) - \$last < self::MIN_INTERVAL\) \{\n            KSEF_Lock::release\(\$lock\);\n            return new WP_Error\('ksef_search_rate_limit'.*?\n        \}\n"),
          ]
          for label, pattern in rules:
              s, n = re.subn(pattern, "", s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"Expected exactly one {label} guard in installed plugin; found {n}. No file was written.")
          p.write_text(s, encoding="utf-8")
          print("Patched installed Search API client: automation toggle, billing flag, project budget, daily cap and interval gates removed; concurrency lock and circuit breaker retained.")
          PY
          jq -n --rawfile content "$CONFIG_FILE" --arg path "plugins/korotkov-seo-factory/includes/class-search-client.php" --arg sha "$EXPECTED_SHA" \
            '{path:$path,content:$content,expected_sha256:$sha}' > "$WRITE_JSON"
          HTTP_CODE=$(curl --silent --show-error --output "$READ_JSON" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$WRITE_JSON" \
            "$KWC_BASE_URL/wp-json/kwc/v1/write")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::WP Control rejected Search API client update (HTTP $HTTP_CODE)."
            jq '{code,message}' "$READ_JSON" 2>/dev/null || true
            exit 1
          fi
          jq '{success,path,backup_id,sha256}' "$READ_JSON"
          VERIFY_JSON="$(mktemp)"
          VERIFY_CODE=$(curl --silent --show-error --output "$VERIFY_JSON" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --get --data-urlencode "path=plugins/korotkov-seo-factory/includes/class-search-client.php" \
            "$KWC_BASE_URL/wp-json/kwc/v1/read")
          [[ "$VERIFY_CODE" == "200" ]] || { echo "::error::Verification read failed (HTTP $VERIFY_CODE)"; exit 1; }
          if jq -e '.content | (contains("KSEF_BILLING_VERIFIED") or contains("ksef_automation_disabled") or contains("ksef_search_daily_limit") or contains("ksef_search_rate_limit") or contains("KSEF_Util::check_budget"))' "$VERIFY_JSON" >/dev/null; then
            echo "::error::One or more blocking guards remain in the live Search API client."
            exit 1
          fi
          echo "SUCCESS: Live Search API client updated and verified."
          rm -f "$READ_JSON" "$WRITE_JSON" "$CONFIG_FILE" "$VERIFY_JSON"
          
          exit 0
          jq -n --rawfile content "$CONFIG_FILE" --arg path "plugins/korotkov-seo-factory/includes/class-search-client.php" --arg sha "$EXPECTED_SHA" \
            '{path:$path,content:$content,expected_sha256:$sha}' > "$WRITE_JSON"
          HTTP_CODE=$(curl --silent --show-error --output "$READ_JSON" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$WRITE_JSON" \
            "$KWC_BASE_URL/wp-json/kwc/v1/write")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::WP Control rejected SEO Factory client write (HTTP $HTTP_CODE)."
            jq '{code,message}' "$READ_JSON" 2>/dev/null || true
            exit 1
          fi
          echo "Search API client updated. Server response:"
          jq '{success,path,backup_id,sha256}' "$READ_JSON"

          # Verify the live plugin file after the update without exposing its contents.
          VERIFY_JSON="$(mktemp)"
          VERIFY_CODE=$(curl --silent --show-error --output "$VERIFY_JSON" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --get --data-urlencode "path=plugins/korotkov-seo-factory/includes/class-search-client.php" \
            "$KWC_BASE_URL/wp-json/kwc/v1/read")
          if [[ "$VERIFY_CODE" != "200" ]]; then
            echo "::error::Could not verify the updated Search API client (HTTP $VERIFY_CODE)."
            exit 1
          fi
          if jq -e '.content | contains("KSEF_BILLING_VERIFIED") | not' "$VERIFY_JSON" >/dev/null; then
            echo "Live Search API client updated: billing flag check removed."
          else
            echo "::error::Live Search API client still contains the billing flag check."
            exit 1
          fi
          rm -f "$READ_JSON" "$WRITE_JSON" "$CONFIG_FILE" "$VERIFY_JSON"
