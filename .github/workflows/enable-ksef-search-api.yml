name: Restore SEO Factory API safety guards

on:
  push:
    branches:
      - design/portfolio-refresh
    paths:
      - '.github/workflows/enable-ksef-search-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksef-restore-safety
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore original Search API client from verified backup
        env:
          KWC_TOKEN: ${{ secrets.KWC_API_TOKEN }}
          WP_USER: ${{ secrets.KWC_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.KWC_WP_APP_PASSWORD }}
          KWC_BASE_URL: https://ipkorotkov.online
        shell: bash
        run: |
          set -euo pipefail
          WP_APP_PASSWORD="${WP_APP_PASSWORD// /}"
          BODY="$(jq -n --arg id "bf25dc2a86a388188f47a58ebd3ef694" '{backup_id:$id}')"
          OUT="$(mktemp)"
          CODE=$(curl --silent --show-error --output "$OUT" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$BODY" "$KWC_BASE_URL/wp-json/kwc/v1/restore")
          if [[ "$CODE" != "200" ]]; then
            echo "::error::Backup restore failed (HTTP $CODE)."
            jq '{code,message}' "$OUT" 2>/dev/null || true
            exit 1
          fi
          jq '{success,path,restored_sha256,rollback_backup_id}' "$OUT"
          READ="$(mktemp)"
          VERIFY=$(curl --silent --show-error --output "$READ" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --get --data-urlencode "path=plugins/korotkov-seo-factory/includes/class-search-client.php" \
            "$KWC_BASE_URL/wp-json/kwc/v1/read")
          [[ "$VERIFY" == "200" ]] || { echo "::error::Could not verify restored file (HTTP $VERIFY)."; exit 1; }
          jq -e '.content | contains("KSEF_BILLING_VERIFIED") and contains("KSEF_Util::check_budget") and contains("DAILY_LIMIT") and contains("MIN_INTERVAL")' "$READ" >/dev/null
          echo "SUCCESS: original billing, project-budget, daily-limit and interval controls are present again."
