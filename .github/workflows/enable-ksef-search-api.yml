name: Enable Korotkov SEO Factory paid Yandex APIs

on:
  push:
    branches:
      - design/portfolio-refresh
    paths:
      - '.github/workflows/enable-ksef-search-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enable-ksef-search-api
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Check connection secrets
        env:
          KWC_TOKEN: ${{ secrets.KWC_API_TOKEN }}
          WP_USER: ${{ secrets.KWC_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.KWC_WP_APP_PASSWORD }}
        run: |
          test -n "$KWC_TOKEN" || { echo "::error::Missing KWC_API_TOKEN"; exit 1; }
          test -n "$WP_USER" || { echo "::error::Missing KWC_WP_USERNAME"; exit 1; }
          test -n "$WP_APP_PASSWORD" || { echo "::error::Missing KWC_WP_APP_PASSWORD"; exit 1; }

      - name: Enable billing flag in wp-config through Korotkov WP Control
        env:
          KWC_TOKEN: ${{ secrets.KWC_API_TOKEN }}
          WP_USER: ${{ secrets.KWC_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.KWC_WP_APP_PASSWORD }}
          KWC_BASE_URL: https://ipkorotkov.online
        shell: bash
        run: |
          set -euo pipefail
          WP_APP_PASSWORD="${WP_APP_PASSWORD// /}"
          READ_JSON="$(mktemp)"
          WRITE_JSON="$(mktemp)"
          CONFIG_FILE="$(mktemp)"
          HTTP_CODE=$(curl --silent --show-error --output "$READ_JSON" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --get --data-urlencode "path=plugins/korotkov-seo-factory/includes/class-search-client.php" \
            "$KWC_BASE_URL/wp-json/kwc/v1/read")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::WP Control cannot read the SEO Factory Search client (HTTP $HTTP_CODE). No change was made."
            jq '{code,message}' "$READ_JSON" 2>/dev/null || true
            exit 1
          fi
          jq -er '.content' "$READ_JSON" > "$CONFIG_FILE"
          EXPECTED_SHA=$(jq -er '.sha256' "$READ_JSON")
          python3 - "$CONFIG_FILE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          billing = re.compile(r"if\s*\(!defined\('KSEF_BILLING_VERIFIED'\)\s*\|\|\s*KSEF_BILLING_VERIFIED\s*!==\s*true\)\s*\{.*?\n\s*\}", re.S)
          s2, n = billing.subn("/* Billing approval flag bypassed for owner-authorized API use. */", s, count=1)
          if n != 1:
              raise SystemExit("Installed Search client did not contain the expected billing guard; refusing an unsafe blind edit.")
          budget = re.compile(r"\$budget\s*=\s*KSEF_Util::check_budget\(\);\s*if\s*\(is_wp_error\(\$budget\)\)\s*\{\s*return\s+\$budget;\s*\}", re.S)
          s2, b = budget.subn("/* Project budget gate disabled by owner instruction. */", s2, count=1)
          if b != 1:
              raise SystemExit("Installed Search client budget guard was not found; refusing an incomplete change.")
          p.write_text(s2, encoding="utf-8")
          PY
          jq -n --rawfile content "$CONFIG_FILE" --arg path "plugins/korotkov-seo-factory/includes/class-search-client.php" --arg sha "$EXPECTED_SHA" \
            '{path:$path,content:$content,expected_sha256:$sha}' > "$WRITE_JSON"
          HTTP_CODE=$(curl --silent --show-error --output "$READ_JSON" --write-out '%{http_code}' \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            --header "X-KWC-Token: $KWC_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$WRITE_JSON" \
            "$KWC_BASE_URL/wp-json/kwc/v1/write")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::WP Control rejected wp-config.php write (HTTP $HTTP_CODE)."
            jq '{code,message}' "$READ_JSON" 2>/dev/null || true
            exit 1
          fi
          echo "Billing flag set. Server response:"
          jq '{success,path,backup_id,sha256}' "$READ_JSON"

          # Extract credentials locally on the runner; never print or upload them.
          python3 - "$CONFIG_FILE" <<'PY'
          import pathlib, re, sys
          s = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          def get(name):
              m = re.search(r"define\\s*\\(\\s*['\\"]" + re.escape(name) + r"['\\"]\\s*,\\s*(['\\"])(.*?)\\1\\s*\\)", s, re.S)
              return m.group(2) if m else ""
          key, folder = get("KSEF_YANDEX_API_KEY"), get("KSEF_YANDEX_FOLDER_ID")
          if not key:
              raise SystemExit("KSEF_YANDEX_API_KEY is not present in wp-config.php")
          pathlib.Path(sys.argv[1] + ".key").write_text(key, encoding="utf-8")
          pathlib.Path(sys.argv[1] + ".folder").write_text(folder, encoding="utf-8")
          PY
          YANDEX_KEY="$(cat "$CONFIG_FILE.key")"
          FOLDER_ID="$(cat "$CONFIG_FILE.folder")"
          echo "::add-mask::$YANDEX_KEY"
          python3 - "$FOLDER_ID" > "$WRITE_JSON" <<'PY'
          import json, sys
          payload = {
            "query": {"searchType":"SEARCH_TYPE_RU","queryText":"настройка VPS для VPN","familyMode":"FAMILY_MODE_STRICT","page":"0","fixTypoMode":"FIX_TYPO_MODE_OFF"},
            "groupSpec":{"groupsOnPage":"10"},
            "region":"225","l10n":"LOCALIZATION_RU","responseFormat":"FORMAT_XML"
          }
          if sys.argv[1]: payload["folderId"] = sys.argv[1]
          print(json.dumps(payload, ensure_ascii=False))
          PY
          SEARCH_CODE=$(curl --silent --show-error --output "$READ_JSON" --write-out '%{http_code}' \
            --request POST "https://searchapi.api.cloud.yandex.net/v2/web/search" \
            --header "Authorization: Api-Key $YANDEX_KEY" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data-binary "@$WRITE_JSON")
          if [[ "$SEARCH_CODE" != "200" ]]; then
            echo "::error::Yandex Search API test failed (HTTP $SEARCH_CODE)."
            jq '{code,message,details}' "$READ_JSON" 2>/dev/null || true
            exit 1
          fi
          jq -r '.rawData' "$READ_JSON" | base64 -d > "$CONFIG_FILE"
          DOCS=$(python3 - "$CONFIG_FILE" <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          print(len(re.findall(r'<(?:[A-Za-z0-9_-]+:)?doc(?:\\s|>)', s)))
          PY
          )
          echo "Yandex Search API test successful: HTTP 200, organic document nodes=$DOCS, query=настройка VPS для VPN, region=225."
          rm -f "$READ_JSON" "$WRITE_JSON" "$CONFIG_FILE" "$CONFIG_FILE.key" "$CONFIG_FILE.folder"
