name: Draft legacy service pages

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-legacy-services.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: draft-legacy-services
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move legacy child service pages to drafts
        env:
          WP_URL: https://ipkorotkov.online
          WP_USER: ${{ secrets.KWC_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.KWC_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WP_USER" || { echo "::error::Missing KWC_WP_USERNAME"; exit 1; }
          test -n "$WP_APP_PASSWORD" || { echo "::error::Missing KWC_WP_APP_PASSWORD"; exit 1; }
          python3 - <<'PY'
          import base64, json, os, sys, time, urllib.parse, urllib.request, urllib.error

          base = os.environ["WP_URL"].rstrip("/")
          user = os.environ["WP_USER"]
          password = os.environ["WP_APP_PASSWORD"].replace(" ", "")
          token = base64.b64encode(f"{user}:{password}".encode()).decode()
          headers = {
              "Authorization": f"Basic {token}",
              "Content-Type": "application/json; charset=utf-8",
              "Accept": "application/json",
              "User-Agent": "Korotkov-Legacy-Service-Maintenance/1.0"
          }

          def api(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              for attempt in range(6):
                  req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          raw = response.read()
                          return json.loads(raw.decode("utf-8")) if raw else {}
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      if exc.code in (429, 500, 502, 503, 504) and attempt < 5:
                          time.sleep(min(2 ** attempt, 20))
                          continue
                      raise RuntimeError(f"HTTP {exc.code} {method} {path}: {body[:1000]}")
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(min(2 ** attempt, 20))

          # Read every page, including drafts, so the operation is repeatable and auditable.
          all_pages = []
          page_number = 1
          while True:
              query = urllib.parse.urlencode({
                  "context": "edit", "status": "any", "per_page": 100,
                  "page": page_number, "_fields": "id,slug,parent,status,link,title"
              })
              batch = api("/wp-json/wp/v2/pages?" + query)
              if not isinstance(batch, list):
                  raise RuntimeError("WordPress did not return a page list.")
              if not batch:
                  break
              all_pages.extend(batch)
              if len(batch) < 100:
                  break
              page_number += 1
              if page_number > 100:
                  raise RuntimeError("Safety stop: more than 10,000 pages returned.")

          by_id = {int(p["id"]): p for p in all_pages}
          services = by_id.get(92)
          parser = next((p for p in all_pages if p.get("slug") == "parser-cen"), None)

          # Fail closed if the two protected pages cannot be identified exactly.
          if not services or services.get("slug") != "services" or services.get("status") != "publish":
              raise RuntimeError("Safety stop: page ID 92 is not the published /services/ navigation page.")
          if not parser or parser.get("status") != "publish":
              raise RuntimeError("Safety stop: the published parser-cen page was not found. No pages were changed.")

          # Only retire the old child-service tree. Keep /services/ and parser-cen published.
          target_ids = set()
          changed = True
          while changed:
              changed = False
              for item in all_pages:
                  pid = int(item["id"])
                  parent = int(item.get("parent") or 0)
                  if pid in (92, int(parser["id"])) or pid in target_ids:
                      continue
                  if parent == 92 or parent in target_ids:
                      target_ids.add(pid)
                      changed = True

          if not target_ids:
              raise RuntimeError("Safety stop: no child service pages were found; nothing was changed.")

          targets = [by_id[pid] for pid in sorted(target_ids)]
          published_targets = [p for p in targets if p.get("status") == "publish"]
          already_draft = sum(1 for p in targets if p.get("status") == "draft")
          print(f"Found {len(targets)} legacy descendants of /services/; {len(published_targets)} currently published.")
          print(f"Protected: /services/ (ID 92), parser-cen (ID {parser['id']}, status {parser['status']}).")

          changed_count = 0
          for index, item in enumerate(published_targets, 1):
              pid = int(item["id"])
              result = api(f"/wp-json/wp/v2/pages/{pid}", "POST", {"status": "draft"})
              if result.get("status") != "draft":
                  raise RuntimeError(f"Page {pid} did not confirm draft status: {result.get('status')}")
              changed_count += 1
              if index % 50 == 0 or index == len(published_targets):
                  print(f"Moved {index}/{len(published_targets)} pages to draft.")
              time.sleep(0.12)

          # Verify by fetching each protected page and re-listing published descendants.
          services_check = api("/wp-json/wp/v2/pages/92?context=edit")
          parser_check = api(f"/wp-json/wp/v2/pages/{int(parser['id'])}?context=edit")
          if services_check.get("status") != "publish":
              raise RuntimeError("/services/ was unexpectedly changed.")
          if parser_check.get("status") != "publish":
              raise RuntimeError("parser-cen was unexpectedly changed.")

          remaining = []
          for item in targets:
              current = api(f"/wp-json/wp/v2/pages/{int(item['id'])}?context=edit")
              if current.get("status") == "publish":
                  remaining.append(int(item["id"]))
          if remaining:
              raise RuntimeError(f"Verification failed: {len(remaining)} legacy child pages remain published. First IDs: {remaining[:30]}")

          summary = (
              f"## Legacy service pages maintenance\n"
              f"- Child pages in legacy tree: {len(targets)}\n"
              f"- Changed from publish to draft: {changed_count}\n"
              f"- Already draft: {already_draft}\n"
              f"- Still published in legacy tree: 0\n"
              f"- Preserved navigation page: /services/ (ID 92)\n"
              f"- Preserved parser page: {parser_check.get('link')} (ID {parser['id']})\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
          PY

      - name: Disable this one-shot workflow after successful verification
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request PUT \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/draft-legacy-services.yml/disable"
          echo "One-shot workflow disabled after successful completion."
