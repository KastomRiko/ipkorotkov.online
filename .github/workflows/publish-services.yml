name: Publish commercial IT service pages

on:
  push:
    branches: [main]
    paths:
      - 'content/services-batch.json'
      - '.github/workflows/publish-services.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-commercial-services
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pages and update service indexes
        env:
          WP_URL: https://ipkorotkov.online
          WP_USER: ${{ secrets.KWC_WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.KWC_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WP_USER" || { echo "::error::Missing KWC_WP_USERNAME"; exit 1; }
          test -n "$WP_APP_PASSWORD" || { echo "::error::Missing KWC_WP_APP_PASSWORD"; exit 1; }
          python3 - <<'PY'
          import base64, json, os, sys, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          base = os.environ["WP_URL"].rstrip("/")
          user = os.environ["WP_USER"]
          password = os.environ["WP_APP_PASSWORD"].replace(" ", "")
          token = base64.b64encode(f"{user}:{password}".encode()).decode()
          headers = {
              "Authorization": f"Basic {token}",
              "Content-Type": "application/json; charset=utf-8",
              "Accept": "application/json",
              "User-Agent": "Korotkov-Service-Publisher/1.0"
          }

          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  print(f"HTTP {e.code} {method} {path}: {body[:1500]}", file=sys.stderr)
                  raise

          batch = json.loads(Path("content/services-batch.json").read_text(encoding="utf-8"))
          services = batch.get("services", [])
          if not isinstance(services, list) or not services or len(services) > 100:
              raise SystemExit("Batch must contain 1–100 services.")
          seen_slugs = set()
          required = ("title", "slug", "focus_keyword", "seo_title", "seo_description", "description", "content")
          for item in services:
              missing = [key for key in required if not str(item.get(key, "")).strip()]
              if missing:
                  raise SystemExit(f"Service {item.get('slug', '<unknown>')} missing: {', '.join(missing)}")
              if item["slug"] in seen_slugs:
                  raise SystemExit(f"Duplicate slug inside batch: {item['slug']}")
              seen_slugs.add(item["slug"])
              words = len(__import__("re").sub(r"<[^>]+>", " ", item["content"]).split())
              if words < 250:
                  raise SystemExit(f"Content too short for {item['slug']}: {words} words")
              if "Частые вопросы" not in item["content"]:
                  raise SystemExit(f"FAQ section missing for {item['slug']}")
          batch_tag = __import__("re").sub(r"[^A-Za-z0-9_-]", "_", batch.get("batch_id", "batch"))
          created = updated = 0
          links = []

          for service in services:
              slug = service["slug"]
              query = urllib.parse.urlencode({"slug": slug, "context": "edit", "per_page": 1})
              existing = request(f"/wp-json/wp/v2/pages?{query}")
              import re, html
              content = service["content"]
              faq_match = re.search(r'<h2>Частые вопросы</h2>(.*?)(?=<h2>|</article>)', content, re.S)
              faq_pairs = re.findall(r'<h3>(.*?)</h3>\s*<p>(.*?)</p>', faq_match.group(1), re.S) if faq_match else []
              def plain(value):
                  return html.unescape(re.sub(r'<[^>]+>', '', value)).strip()
              faq_schema = {
                  "@context": "https://schema.org",
                  "@type": "FAQPage",
                  "mainEntity": [
                      {"@type": "Question", "name": plain(q),
                       "acceptedAnswer": {"@type": "Answer", "text": plain(a)}}
                      for q, a in faq_pairs
                  ]
              }
              breadcrumb_schema = {
                  "@context": "https://schema.org",
                  "@type": "BreadcrumbList",
                  "itemListElement": [
                      {"@type": "ListItem", "position": 1, "name": "Главная", "item": base + "/"},
                      {"@type": "ListItem", "position": 2, "name": "Услуги", "item": base + "/services/"},
                      {"@type": "ListItem", "position": 3, "name": service["title"], "item": base + "/services/" + slug + "/"}
                  ]
              }
              schema_scripts = (
                  '<script type="application/ld+json">' + json.dumps(faq_schema, ensure_ascii=False) + '</script>'
                  + '<script type="application/ld+json">' + json.dumps(breadcrumb_schema, ensure_ascii=False) + '</script>'
              )
              if "</article>" in content and '"@type":"FAQPage"' not in content:
                  content = content.replace("</article>", schema_scripts + "</article>")
              payload = {
                  "title": service["title"],
                  "slug": slug,
                  "content": content,
                  "excerpt": service["description"],
                  "status": "publish",
                  "parent": 92,
                  "meta": {
                      "_yoast_wpseo_title": service["seo_title"],
                      "_yoast_wpseo_metadesc": service["seo_description"],
                      "_yoast_wpseo_focuskw": service["focus_keyword"]
                  }
              }
              if existing:
                  page = request(f"/wp-json/wp/v2/pages/{existing[0]['id']}?context=edit", "POST", payload)
                  updated += 1
                  action = "UPDATED"
              else:
                  page = request("/wp-json/wp/v2/pages", "POST", payload)
                  created += 1
                  action = "CREATED"
              link = page.get("link") or f"{base}/services/{slug}/"
              links.append((service["title"], link))
              print(f"{action}: {service['title']} | {link} | id={page.get('id')}")
              meta = page.get("meta") or {}
              if meta.get("_yoast_wpseo_title") != service["seo_title"] or meta.get("_yoast_wpseo_metadesc") != service["seo_description"]:
                  print(f"SEO_META_CHECK: Yoast fields were not confirmed by REST for {slug}; verify in SEO plugin UI.")

          def append_section(page_id, marker, markup, expected_links):
              page = request(f"/wp-json/wp/v2/pages/{page_id}?context=edit")
              page_content = page.get("content") or {}
              raw = page_content.get("raw") if isinstance(page_content, dict) else page_content
              raw = raw or ""
              def links_present(value):
                  return all(f'href="{link}"' in value for _, link in expected_links)
              if marker in raw and links_present(raw):
                  print(f"INDEX_ALREADY_UPDATED_AND_LINKS_VERIFIED: page {page_id}")
                  return
              actual_marker = marker if marker not in raw else marker.replace("-->", "_LINKFIX -->")
              updated_content = raw.rstrip() + "\n\n" + actual_marker + "\n" + markup + "\n"
              request(f"/wp-json/wp/v2/pages/{page_id}", "POST", {"content": updated_content})
              verify_page = request(f"/wp-json/wp/v2/pages/{page_id}?context=edit")
              verify_content = verify_page.get("content") or {}
              verify_raw = verify_content.get("raw") if isinstance(verify_content, dict) else verify_content
              verify_raw = verify_raw or ""
              missing_links = [link for _, link in expected_links if f'href="{link}"' not in verify_raw]
              if missing_links:
                  raise RuntimeError(f"Index page {page_id}: WordPress did not preserve {len(missing_links)} expected anchor links.")
              print(f"INDEX_UPDATED_AND_LINKS_VERIFIED: page {page_id} | links={len(expected_links)}")

          catalog_html = '<section class="korotkov-new-services"><h2>Дополнительные услуги программиста</h2><ul>' + "".join(
              f'<li><a href="{link}">{title}</a></li>' for title, link in links
          ) + '</ul></section>'
          sitemap_html = '<h2>Дополнительные услуги</h2><ul>' + "".join(
              f'<li><a href="{link}">{title}</a></li>' for title, link in links
          ) + '</ul>'

          append_section(92, f"<!-- KOROTKOV_SERVICES_{batch_tag} -->", catalog_html, links)
          append_section(775, f"<!-- KOROTKOV_SITEMAP_{batch_tag} -->", sitemap_html, links)
          print(f"SUMMARY: created={created} updated={updated} indexed={len(links)} batch={batch.get('batch_id')}")
          PY
