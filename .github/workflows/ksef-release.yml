name: Korotkov SEO Factory 0.9.0

on:
  push:
    branches:
      - design/portfolio-refresh
    paths:
      - 'dveri/korotkov-seo-factory/**'
      - '.github/workflows/ksef-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax check
        run: |
          find dveri/korotkov-seo-factory -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build plugin ZIP
        run: |
          mkdir -p dist
          cp -R dveri/korotkov-seo-factory dist/korotkov-seo-factory
          cd dist
          zip -qr korotkov-seo-factory-0.9.0.zip korotkov-seo-factory
      - uses: actions/upload-artifact@v4
        with:
          name: korotkov-seo-factory-0.9.0
          path: dist/korotkov-seo-factory-0.9.0.zip
          if-no-files-found: error
          retention-days: 30
