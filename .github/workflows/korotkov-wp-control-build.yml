name: Korotkov WP Control — build plugin ZIP

on:
  push:
    branches: [design/portfolio-refresh]
    paths:
      - 'korotkov-wp-control/**'
      - '.github/workflows/korotkov-wp-control-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: php -l korotkov-wp-control/korotkov-wp-control.php

      - name: Check Python syntax
        run: python -m py_compile korotkov-wp-control/mcp-server/server.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Build installable plugin
        run: |
          mkdir -p build/korotkov-wp-control
          cp korotkov-wp-control/korotkov-wp-control.php build/korotkov-wp-control/
          cp korotkov-wp-control/README.md build/korotkov-wp-control/readme.txt
          cd build
          zip -r korotkov-wp-control.zip korotkov-wp-control

      - name: Publish ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: korotkov-wp-control
          path: build/korotkov-wp-control.zip
          if-no-files-found: error
          retention-days: 30
