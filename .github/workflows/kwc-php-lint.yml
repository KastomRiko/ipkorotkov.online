name: Korotkov WP Control PHP lint

on:
  push:
    paths:
      - 'korotkov-wp-control/**'
      - '.github/workflows/kwc-php-lint.yml'
  pull_request:
    paths:
      - 'korotkov-wp-control/**'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.1'
      - name: Lint plugin
        run: php -l korotkov-wp-control/korotkov-wp-control.php
